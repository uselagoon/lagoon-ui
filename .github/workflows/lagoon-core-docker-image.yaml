name: Publish lagoon-core-ui image

on:
  push:
    tags:
      - 'core-v*.*.*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      -
        name: Checkout Branch or Tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          fetch-depth: "0"
      -
        name: Set version for tag build
        if: "startsWith(github.ref, 'refs/tags/')"
        id: version_tag_build
        run: |
          LAGOON_VERSION=$(echo $(git describe --abbrev=0 --tags --match 'core-v*'))
          UI_VERSION=$(echo $(git describe --abbrev=0 --tags --match 'v*'))
          BUILD=$(date +%FT%T%z)
          echo "LAGOON_VERSION=$LAGOON_VERSION" >> $GITHUB_ENV
          echo "UI_VERSION=$UI_VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "lagoon-ui $UI_VERSION (built: $BUILD) tagged as $LAGOON_VERSION"
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ github.repository_owner }}/ui
            ghcr.io/${{ github.repository_owner }}/ui
          tags: |
            # tag event
            type=ref,event=tag
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      -
        name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build-and-push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # platforms: linux/amd64
          build-args: |
            "LAGOON_VERSION=${{ env.LAGOON_VERSION }}"
            "UI_VERSION=${{ env.UI_VERSION }}"
            "BUILD=${{ env.BUILD }}"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
      -
        name: Attest tagged ghcr images
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        if: github.ref_type == 'tag'
        with:
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository_owner }}/ui
          push-to-registry: true
